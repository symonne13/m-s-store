{% extends 'app/base.html' %}
{% load static %}

{% block title %}Collections | M's Jewellery Store{% endblock %}

{% block content %}
<!-- Page header -->
<section class="relative isolate overflow-hidden">

  <!-- Background image -->
  <img src="{% static 'images/bracelet.jpg' %}" alt="me"
       class="absolute inset-0 -z-10 h-full w-full object-cover object-center">

  <!-- Dark layer so the text is readable -->
  <div class="absolute inset-0 -z-10 bg-black/55"></div>

  <div class="max-w-6xl mx-auto px-6 py-24 text-center text-white md:px-10 md:py-32">
    <p class="text-xs font-medium tracking-[0.3em] text-gold-light">COLLECTIONS</p>
    <h1 class="mt-4 text-4xl font-semibold md:text-5xl">Find Your Perfect Piece</h1>
    <p class="mx-auto mt-4 max-w-xl text-white/90">
      Discover elegant pieces designed to celebrate your style, your story and your special moments.
    </p>
  </div>

</section>

<!-- Products -->
<section class="bg-pearl">
  <div class="max-w-6xl mx-auto px-6 py-16 md:px-10">

       <!-- Category filter -->
    <div class="flex flex-wrap justify-center gap-3">
      <button type="button" data-filter="all" class="filter-btn rounded-full bg-gold-dark px-6 py-2 text-sm font-medium text-white">All</button>
      <button type="button" data-filter="rings" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Rings</button>
      <button type="button" data-filter="necklaces" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Necklaces</button>
      <button type="button" data-filter="earrings" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Earrings</button>
      <button type="button" data-filter="bracelets" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Bracelets</button>
      <button type="button" data-filter="anklets" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Anklets</button>
      <button type="button" data-filter="nose-rings" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Nose Rings</button>
      <button type="button" data-filter="sets" class="filter-btn rounded-full bg-white px-6 py-2 text-sm font-medium text-ink">Sets</button>
    </div>

    <!-- Cards are drawn here by main.js -->
    <div id="product-grid" class="mt-12 grid gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>

  </div>
</section>

<!-- Product details pop-up -->
<div id="product-modal" class="fixed inset-0 z-[70] hidden items-center justify-center bg-black/60 p-4">
  <div class="relative max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white">
    <button type="button" id="modal-close"
            class="absolute right-4 top-4 z-10 flex h-9 w-9 items-center justify-center rounded-full bg-white text-xl shadow"
            aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

{% endblock %}
